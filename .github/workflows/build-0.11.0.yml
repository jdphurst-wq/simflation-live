name: Build and audit SimFlation 0.11.0

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-0.11.0.mjs'
      - 'scripts/audit-0.11.0-browser.cjs'
      - 'SimFlation-0.10.0.html'
      - '.github/workflows/build-0.11.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalise 0.11.0 build targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-0.11.0.mjs')
          s = p.read_text()
          s = s.replace(
              '  "(() => {\\n  \'use strict\';\\n",\n',
              '  "(() => {\\n  \'use strict\';\\n  const elementCache=new Map(),",\n',
              1,
          )
          s = s.replace(
              '    const n=Math.max(1,households.length);v011MigrationStats={recentShare:recent/n*100,foreignShare:foreign/n*100,descendantShare:descendant/n*100,highSkillShare:foreign?highSkill/foreign*100:0};v011MigrationStatsMonth=monthIndex;return v011MigrationStats\\n  }\\n`\n);',
              '    const n=Math.max(1,households.length);v011MigrationStats={recentShare:recent/n*100,foreignShare:foreign/n*100,descendantShare:descendant/n*100,highSkillShare:foreign?highSkill/foreign*100:0};v011MigrationStatsMonth=monthIndex;return v011MigrationStats\\n  }\\n  const elementCache=new Map(),`\n);',
              1,
          )
          s = s.replace(
              '  function minimumBankCount(){return households.length>=250?4:households.length>=100?3:households.length>=25?2:1}\\n',
              '  function minimumBankCount(){return households.length>=250?4:households.length>=100?3:households.length>=25?2:1}\\n  function preferredBankCount(){return households.length>=250?6:households.length>=100?4:households.length>=25?3:1}\\n',
              1,
          )
          lines = s.splitlines()
          marker = "  'public capital recovers before private bank dividends',"
          if marker not in lines:
              raise SystemExit('Missing public-capital patch marker')
          i = lines.index(marker)
          if lines[i+1] == '  "}const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)",':
              lines[i+1] = '  "      const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)",'
          if lines[i+2].startswith('  "}const publicClaim='):
              lines[i+2] = lines[i+2].replace('  "}const publicClaim=', '  "      const publicClaim=', 1)
          s = '\n'.join(lines) + '\n'
          s = s.replace(
              'classCounts=Object.fromEntries(Object.keys(classLabels).map(k=>[k,Object.values(classes).filter(v=>v===k).length));return{',
              'classCounts=Object.fromEntries(Object.keys(classLabels).map(k=>[k,Object.values(classes).filter(v=>v===k).length]));return{',
              1,
          )
          s = s.replace(
              '"-recentFailurePenalty*.35-minimumScalePenalty+Math.max(0,minimumBankCount()-banksNow.length)*.012,0,.06)"',
              '"-recentFailurePenalty*.20-minimumScalePenalty*.20+Math.max(0,preferredBankCount()-banksNow.length)*.025+Math.max(0,concentration-.24)*.025,0,.09)"',
              1,
          )
          entry_anchor = "replaceAllChecked(\n  'shared minimum bank rule',"
          entry_patch = """replaceOnce(
  'private bank entry capital target',
  'Math.max(300000*nominalScale(),annualGDPReference()*.006)',
  'Math.max(220000*nominalScale(),annualGDPReference()*.0045)'
);
replaceOnce(
  'private bank entry viability threshold',
  'raised>=target*.95&&raised>=Math.max(250000*nominalScale(),annualGDPReference()*.005)',
  'raised>=target*.90&&raised>=Math.max(180000*nominalScale(),annualGDPReference()*.0035)'
);

"""
          if "'private bank entry capital target'" not in s:
              if entry_anchor not in s:
                  raise SystemExit('Missing private-bank entry insertion point')
              s = s.replace(entry_anchor, entry_patch + entry_anchor, 1)
          required = [
              '  "(() => {\\n  \'use strict\';\\n  const elementCache=new Map(),",',
              '  "      const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)",',
              'classCounts=Object.fromEntries(Object.keys(classLabels).map(k=>[k,Object.values(classes).filter(v=>v===k).length]));return{',
              'function preferredBankCount()',
              "'private bank entry capital target'",
              'preferredBankCount()-banksNow.length',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('0.11.0 normalisation incomplete: ' + repr(missing))
          p.write_text(s)
          PY
      - name: Build 0.11.0
        run: node scripts/build-0.11.0.mjs
      - name: Verify generated release identity
        run: |
          cmp -s SimFlation-0.11.0.html index.html
          grep -q '"version": "0.11.0"' version.json
          grep -q '"modelVersion": "0.11.0"' version.json
          grep -q '<title>SimFlation 0.11.0</title>' index.html
          grep -q 'edition-badge">0.11.0<' index.html
          grep -q 'SIMFLATION_0_11_0_RUNTIME_START' index.html
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Start local simulator server
        run: python3 -m http.server 8000 >/tmp/simflation-http.log 2>&1 &
      - name: Run repeated, performance and 100-year banking audits
        run: node scripts/audit-0.11.0-browser.cjs
      - name: Commit audited 0.11.0 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-0.11.0.mjs SimFlation-0.11.0.html index.html version.json
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git commit -m "Release SimFlation 0.11.0"
          git push

name: Build and audit SimFlation 0.11.0

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-0.11.0.mjs'
      - 'scripts/audit-0.11.0-browser.cjs'
      - 'SimFlation-0.10.0.html'
      - '.github/workflows/build-0.11.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalise 0.11.0 build targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-0.11.0.mjs')
          s = p.read_text()

          old = '  "(() => {\\n  \'use strict\';\\n",\n'
          new = '  "(() => {\\n  \'use strict\';\\n  const elementCache=new Map(),",\n'
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '    const n=Math.max(1,households.length);v011MigrationStats={recentShare:recent/n*100,foreignShare:foreign/n*100,descendantShare:descendant/n*100,highSkillShare:foreign?highSkill/foreign*100:0};v011MigrationStatsMonth=monthIndex;return v011MigrationStats\\n  }\\n`\n);'
          new2 = '    const n=Math.max(1,households.length);v011MigrationStats={recentShare:recent/n*100,foreignShare:foreign/n*100,descendantShare:descendant/n*100,highSkillShare:foreign?highSkill/foreign*100:0};v011MigrationStatsMonth=monthIndex;return v011MigrationStats\\n  }\\n  const elementCache=new Map(),`\n);'
          if old2 in s:
              s = s.replace(old2, new2, 1)

          old3 = '''  "}const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)",
  "}const publicClaim=Math.max(0,bank.publicResolutionEquity||0);if(publicClaim>0){const publicRecovery=Math.min(publicClaim,Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)*.30,Math.max(0,bank.reserves-reserveTarget)*.30);if(publicRecovery>0){bank.reserves-=publicRecovery;bank.publicResolutionEquity=Math.max(0,publicClaim-publicRecovery);world.centralBankResolutionRecoveries=(world.centralBankResolutionRecoveries||0)+publicRecovery}}const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)"'''
          new3 = '''  "      const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)",
  "      const publicClaim=Math.max(0,bank.publicResolutionEquity||0);if(publicClaim>0){const publicRecovery=Math.min(publicClaim,Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)*.30,Math.max(0,bank.reserves-reserveTarget)*.30);if(publicRecovery>0){bank.reserves-=publicRecovery;bank.publicResolutionEquity=Math.max(0,publicClaim-publicRecovery);world.centralBankResolutionRecoveries=(world.centralBankResolutionRecoveries||0)+publicRecovery}}const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)"'''
          if old3 in s:
              s = s.replace(old3, new3, 1)

          if '  "(() => {\\n  \'use strict\';\\n  const elementCache=new Map(),",' not in s or '  const elementCache=new Map(),`\n);' not in s:
              raise SystemExit('Could not establish the unique main-model 0.11.0 build anchor')
          if '  "      const remainingExcess=Math.max(0,bankEquity(bank)-bankRWA(bank)*dividendTarget)",' not in s:
              raise SystemExit('Could not establish the 0.11.0 public-capital dividend target')
          p.write_text(s)
          PY
      - name: Build 0.11.0
        run: node scripts/build-0.11.0.mjs
      - name: Verify generated release identity
        run: |
          cmp -s SimFlation-0.11.0.html index.html
          grep -q '"version": "0.11.0"' version.json
          grep -q '"modelVersion": "0.11.0"' version.json
          grep -q '<title>SimFlation 0.11.0</title>' index.html
          grep -q 'edition-badge">0.11.0<' index.html
          grep -q 'SIMFLATION_0_11_0_RUNTIME_START' index.html
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Start local simulator server
        run: python3 -m http.server 8000 >/tmp/simflation-http.log 2>&1 &
      - name: Run repeated, performance and 100-year banking audits
        run: node scripts/audit-0.11.0-browser.cjs
      - name: Commit audited 0.11.0 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-0.11.0.mjs SimFlation-0.11.0.html index.html version.json
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git commit -m "Release SimFlation 0.11.0"
          git push

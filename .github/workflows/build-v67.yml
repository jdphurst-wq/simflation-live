name: Build SimFlation v67

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-v67.mjs'
      - 'scripts/release-0.10.0.mjs'
      - 'SimFlation-v66.html'
      - '.github/workflows/build-v67.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply 0.10.0 release identity
        run: node scripts/release-0.10.0.mjs
      - name: Build v67
        run: node scripts/build-v67.mjs
      - name: Verify canonical files
        run: |
          cmp -s SimFlation-v67.html index.html
          cmp -s SimFlation-v67.html SimFlation-0.10.0.html
          grep -q '"version": "0.10.0"' version.json
          grep -q '"modelVersion": "v67"' version.json
          grep -q '<title>SimFlation 0.10.0</title>' index.html
          grep -q 'edition-badge">0.10.0<' index.html
      - name: Commit generated 0.10.0 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-v67.mjs SimFlation-v67.html SimFlation-0.10.0.html index.html version.json
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git commit -m "Release SimFlation 0.10.0 model v67"
          git push

name: SimFlation 0.11.2 release gate

on:
  push:
    branches:
      - agent/simflation-0.11.2
    paths:
      - SimFlation-0.11.1.html
      - scripts/build-0.11.2.mjs
      - scripts/audit-0.11.2-browser.cjs
      - .github/workflows/release-0.11.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simflation-0.11.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit-${{ matrix.audit_case }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        audit_case:
          - resolve42
          - resolve7
          - resolve99
          - noSupport42
          - bailout7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build standalone release
        run: node scripts/build-0.11.2.mjs
      - name: Verify generated release identity
        run: |
          cmp -s index.html SimFlation-0.11.2.html
          grep -q '<title>SimFlation 0.11.2</title>' index.html
          grep -q 'SIMFLATION_0_11_2_RUNTIME_START' index.html
          grep -q '"version": "0.11.2"' version.json
      - name: Install browser test runtime
        run: npm install --no-save playwright@1.54.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 0.11.2 browser and long-horizon audits
        env:
          SIMFLATION_AUDIT_CASE: ${{ matrix.audit_case }}
        run: |
          set -o pipefail
          python3 -m http.server 8000 > /tmp/simflation-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/audit-0.11.2-browser.cjs | tee audit-0.11.2.log
  publish-candidate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build verified release artefacts
        run: node scripts/build-0.11.2.mjs
      - name: Commit verified release artefacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SimFlation-0.11.2.html index.html version.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build verified SimFlation 0.11.2 release artefacts'
          git push
